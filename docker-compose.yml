services:
  mailoney:
    build: .
    restart: unless-stopped
    ports:
      - "25:25"
    environment:
      - MAILONEY_BIND_IP=0.0.0.0
      - MAILONEY_BIND_PORT=25
      - MAILONEY_SERVER_NAME=mail.example.com
      - MAILONEY_LOG_LEVEL=INFO
      - MAILONEY_DB_URL=postgresql://postgres:postgres@db:5432/mailoney
      # Uncomment together with the volume mount below to retain
      # captured SMTP message bodies on disk as .eml files. Without
      # MAILONEY_MAIL_DIR set, bodies are discarded after their
      # size/truncated metadata is recorded.
      # - MAILONEY_MAIL_DIR=/var/lib/mailoney/mail
    # volumes:
    #   - ./mail-capture:/var/lib/mailoney/mail
    depends_on:
      - db
    
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mailoney
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
